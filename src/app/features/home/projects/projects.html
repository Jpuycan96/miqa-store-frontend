<section id="proyectos" class="page-shell projects" aria-labelledby="projects-title">
  <div class="projects-heading">
    <div>
      <p class="eyebrow">Hecho por MIQA</p>
      <h2 id="projects-title">Proyectos que hablan<br> por nosotros.</h2>
    </div>
    <div class="projects-intro">
      <p>Ideas que se convirtieron en espacios, piezas e instalaciones reales.</p>
      <a class="projects-link" routerLink="/proyectos">Ver todos los proyectos <span aria-hidden="true">→</span></a>
    </div>
  </div>
  <div class="projects-grid">
    @for (project of projects(); track project.id) {
      <figure class="project" [class.project--lead]="project.layoutVariant === 'lead'">
        <div class="project-media">
          @if (project.image; as image) {
            <img [ngSrc]="image" [alt]="project.imageAlt || project.title" fill loading="lazy" sizes="(min-width: 1200px) 50vw, (min-width: 768px) 50vw, 100vw">
          }
        </div>
        <figcaption>
          <h3>{{ project.title }}</h3>
        </figcaption>
      </figure>
    }
  </div>
</section>
