<section class="page-shell hero" aria-labelledby="hero-title">
 <div class="hero-copy">
  <p class="eyebrow flex items-center gap-3"><span class="brand-dot" aria-hidden="true"></span> Ideas que se hacen realidad</p>
  <h1 id="hero-title">Hacemos<br>visible<br><span class="last-line">tu marca<span class="cyan-dot">.</span></span></h1>
  <p class="intro">Impresión, publicidad y soluciones gráficas hechas para destacar.</p>
  <div class="actions flex flex-wrap items-center gap-x-7 gap-y-5">
   <a class="primary-button" href="#categorias">Explorar productos <span aria-hidden="true">↗</span></a>
   <button class="text-button" (click)="contact.emit()">Hablar con nosotros <span aria-hidden="true">↗</span></button>
  </div>
  <p class="hero-note"><span aria-hidden="true">✳</span> Tu idea. Nuestro oficio. Una marca que se ve.</p>
 </div>
 <figure class="hero-visual" aria-label="Productos gráficos MIQA">
  <div class="hero-product hero-rollup">
   <img ngSrc="/images/hero/rollo-up.png" width="1024" height="1536" priority alt="Roll-up publicitario MIQA">
  </div>
  <div class="hero-product hero-cards">
   <img ngSrc="/images/hero/tarjetas-personales.png" width="1385" height="1136" loading="eager" alt="Tarjetas personales MIQA">
  </div>
  <div class="hero-product hero-signage">
   <img ngSrc="/images/hero/senaletica.png" width="1536" height="1024" loading="eager" alt="Señalética impresa">
  </div>
 </figure>
</section>
