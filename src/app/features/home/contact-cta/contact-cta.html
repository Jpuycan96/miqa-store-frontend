<section class="contact-band" aria-labelledby="contact-title">
  <div class="page-shell contact-layout">
    <div class="contact-copy">
      <p class="eyebrow">¿Tienes una idea en mente?</p>
      <h2 id="contact-title">Cuéntanos qué necesitas y te ayudamos a hacerlo realidad.</h2>
    </div>
    <div class="contact-action">
      <a class="contact-link" [href]="contactUrl" target="_blank" rel="noopener noreferrer"
        aria-label="Conversemos por WhatsApp (abre una nueva pestaña)">
        Conversemos <span aria-hidden="true">→</span>
      </a>
    </div>
  </div>
</section>
