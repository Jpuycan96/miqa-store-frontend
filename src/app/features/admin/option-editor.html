<section class="section">
  <h2>{{kind()==='materials'?'Materiales':'Extras'}}</h2>
  <ul class="list">
    @for(o of options();track o.id){
      <li class="compact-row material-row">
        <strong>{{o.name}}</strong><span class="status">{{o.active?'Activo':'Inactivo'}}</span>
        <button type="button" (click)="edit(o)" [disabled]="busy()" [attr.aria-label]="'Editar ' + o.name">Editar</button>
      </li>
    }@empty{<li class="muted">Todavía no hay opciones.</li>}
  </ul>
  <form class="section compact-form" [formGroup]="form" (ngSubmit)="save()">
    <h3>{{id()?'Editar opción':'Agregar opción'}}</h3>
    <div class="material-fields">
      <label>Nombre<input formControlName="name" maxlength="160" required></label>
      <label class="check"><input type="checkbox" formControlName="active">Activo</label>
    </div>
    @if(error()){<p class="feedback error" role="alert">{{error()}}</p>}
    @if(message()){<p class="feedback" role="status">{{message()}}</p>}
    <div class="actions">
      <button class="primary" [disabled]="busy()||form.invalid">{{busy()?'Guardando…':'Guardar'}}</button>
      <button type="button" (click)="edit()" [disabled]="busy()">Cancelar</button>
    </div>
  </form>
</section>
