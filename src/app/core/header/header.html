<header class="site-header">
 <div class="top-strip"><nav class="header-shell" aria-label="Navegación superior"><a routerLink="/" (click)="navigate()">INICIO</a><span aria-disabled="true" title="Próximamente">NOSOTROS <small>Próximamente</small></span><span aria-disabled="true" title="Próximamente">UBÍCANOS <small>Próximamente</small></span></nav></div>
 <div class="header-shell main-bar">
  <a routerLink="/" aria-label="MIQA Soluciones Gráficas, inicio" class="brand" (click)="navigate()"><img ngSrc="/images/brand/logo-miqa3.png" width="2048" height="768" priority alt="MIQA Soluciones Gráficas"></a>
  <nav aria-label="Categorías de productos" class="desktop-nav">
   @for(c of categories();track c.slug){<a routerLink="/productos" [queryParams]="{categoria:c.slug}" (click)="navigate()">{{c.name}}</a>}
   <a class="all" href="/productos">TODOS</a>
  </nav>
  <div class="controls">
   <button class="icon-button quote-toggle" [attr.aria-label]="'Abrir cotización: ' + quote.totalItems() + ' productos configurados'" aria-controls="quote-drawer" aria-haspopup="dialog" [attr.aria-expanded]="quote.isOpen()" (click)="navigate(); quote.open()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5H5v16h14V5h-3M8 3h8v4H8zM8 12h8M8 16h5"/></svg><span class="quote-count" aria-hidden="true">{{quote.totalItems()}}</span></button>
   <button #searchToggle class="icon-button search-toggle" aria-label="Buscar productos" [attr.aria-expanded]="searchOpen()" aria-controls="site-search" (click)="toggleSearch()"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
   <button #menu class="icon-button mobile-toggle" [attr.aria-expanded]="menuOpen()" aria-controls="mobile-nav" [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'" (click)="searchOpen.set(false);menuOpen.set(!menuOpen())"><svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="menuOpen() ? 'M6 6l12 12M6 18L18 6' : 'M4 8h16M4 16h16'"/></svg></button>
  </div>
 </div>
 <nav id="mobile-nav" aria-label="Navegación móvil" [hidden]="!menuOpen()" (keydown.escape)="closeMenu();menu.focus()" class="mobile-nav header-shell">
  <a routerLink="/" (click)="navigate()">INICIO</a><span aria-disabled="true">NOSOTROS <small>Próximamente</small></span><span aria-disabled="true">UBÍCANOS <small>Próximamente</small></span>
  <p class="menu-label">PRODUCTOS</p>
  @for(c of categories();track c.slug){<a routerLink="/productos" [queryParams]="{categoria:c.slug}" (click)="navigate()">{{c.name}}</a>}
  <a href="/productos">TODOS</a>
  <button (click)="toggleSearch()">Buscar productos</button><button (click)="navigate();quote.open()">Abrir cotización</button>
 </nav>
 <form id="site-search" class="search-panel header-shell" [hidden]="!searchOpen()" (submit)="$event.preventDefault();submitSearch()" (keydown.escape)="closeSearch()" role="search">
  <label for="header-product-search">Buscar productos</label><div class="search-field"><input #searchInput id="header-product-search" type="search" maxlength="120" placeholder="¿Qué necesitas crear?" [formControl]="search"><button type="submit">Ver resultados</button></div>
 </form>
</header>
<app-floating-whatsapp />
