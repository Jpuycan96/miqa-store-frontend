<header class="site-header">
 <div class="header-shell main-bar">
  <a routerLink="/" aria-label="MIQA Soluciones Gráficas, inicio" class="brand" (click)="navigate()"><img ngSrc="/images/brand/logo-tienda-2.png" fill priority alt="MIQA Soluciones Gráficas"></a>
  <button type="button" class="menu-toggle" #menuButton aria-label="Abrir menú de categorías" aria-haspopup="dialog" [attr.aria-controls]="menuOpen() ? 'category-drawer' : null" [attr.aria-expanded]="menuOpen()" (click)="openMenu(menuButton)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Menú</span></button>
  <div id="site-search" class="inline-search" [class.search-active]="searchOpen()" (keydown.escape)="closeSearch()" role="search">
   <input #searchInput id="header-product-search" type="search" maxlength="120" aria-label="Buscar productos" placeholder="Buscar productos en MIQA" [formControl]="search" (focus)="searchOpen.set(true)">
   <button #searchToggle type="button" class="search-toggle" aria-label="Buscar productos" aria-controls="header-product-search" (click)="toggleSearch()"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
   @if(searchOpen() && !catalogMode() && search.value.trim()){
    <div class="search-results">
     @if(results().loading){<p role="status">Buscando…</p>}
     @else if(results().error){<p role="alert">No pudimos buscar productos.</p>}
     @else{
      @for(product of results().products;track product.id){<a [routerLink]="['/productos',product.slug]" (click)="navigate()">{{product.name}}</a>}
      @empty{<p role="status">Sin resultados.</p>}
     }
    </div>
   }
  </div>
  <div class="controls">
   <button type="button" class="quote-toggle" [attr.aria-label]="'Abrir cotización: ' + quote.totalItems() + ' productos configurados'" [attr.aria-controls]="catalogMode() && quotePresentation.panelVisible() ? 'integrated-quote-panel' : null" [attr.aria-expanded]="catalogMode() && quotePresentation.panelVisible() && (!quotePresentation.lateral() || quotePresentation.sideOpen())" (click)="openQuote()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h3l3 12h11l3-9H6M9 15l-1 3h12"/><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/></svg><span class="quote-count" aria-hidden="true">{{quote.totalItems()}}</span></button>
  </div>
 </div>
</header>
<app-category-drawer [categories]="categories()" [loading]="categoryState().loading" [error]="categoryState().error" [activeCategory]="activeCategory()" [activeSubcategory]="activeSubcategory()" [search]="menuSearch()" (openedChange)="menuOpen.set($event)" (retry)="retryCategories()" (navigated)="navigate()" />
<app-floating-whatsapp />
